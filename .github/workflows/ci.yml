name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# quality and db are required checks, so they always run: a path filter would leave them pending
# and block the merge. A documentation-only change (scripts/docs-only.sh) skips their heavy steps
# instead; a step skipped by `if` keeps the job green. quality still checks formatting, because
# Prettier covers the root *.md files. In db, a pull request runs only the database tests its change
# can reach (scripts/db-test-scope.ts); main runs them all.
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      SUPABASE_SECRET_KEY: sb_secret_ci
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@example.test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request checks out its merge commit, whose first parent is the base branch.
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if sh scripts/docs-only.sh "$BASE" HEAD; then docs_only=true; else docs_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: steps.scope.outputs.docs_only != 'true'
        run: bun run lint
      - run: bun run format:check
      - if: steps.scope.outputs.docs_only != 'true'
        run: bun run typecheck
      - if: steps.scope.outputs.docs_only != 'true'
        run: bun run test
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if sh scripts/docs-only.sh "$BASE" HEAD; then docs_only=true; else docs_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.scope.outputs.docs_only != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - if: steps.scope.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile
      - if: steps.scope.outputs.docs_only != 'true'
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,realtime,storage-api,supavisor
      - if: steps.scope.outputs.docs_only != 'true'
        run: supabase db advisors --local
      # No base on main: everything runs there, the safety net after each merge.
      - if: steps.scope.outputs.docs_only != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: bun scripts/db-test-scope.ts "$BASE" HEAD
      - if: steps.scope.outputs.docs_only != 'true'
        run: bunx playwright install --with-deps chromium
      # Next's build cache (https://nextjs.org/docs/app/guides/ci-build-caching): faster e2e builds.
      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'messages/**', 'public/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - if: steps.scope.outputs.docs_only != 'true'
        run: bun run test:e2e
      - if: steps.scope.outputs.docs_only != 'true'
        run: bun scripts/check-build-log.ts .e2e-build.log
