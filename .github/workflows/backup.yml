name: Backup
# Spec §5: nightly dump of production (roles, schema, data, the migration history and our triggers
# on Supabase's auth tables) through the IPv4 Session pooler, restored into a throwaway local
# Supabase stack and checked table by table, then encrypted with age to the Owner's public key and
# kept 30 days. Supabase Free has no automatic backups. Steps follow Supabase's "Backup and restore
# using the CLI" guide.
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Dump production
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          mkdir -p dump
          supabase db dump --db-url "$DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$DB_URL" -f dump/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vector_indexes" -x "vault.secrets"
          supabase db dump --db-url "$DB_URL" -f dump/history_schema.sql --schema supabase_migrations
          supabase db dump --db-url "$DB_URL" -f dump/history_data.sql --use-copy --data-only --schema supabase_migrations
          psql "$DB_URL" -At -v ON_ERROR_STOP=1 -f scripts/backup-auth-triggers.sql > dump/auth-triggers.sql
          psql "$DB_URL" -At -v ON_ERROR_STOP=1 -f scripts/backup-counts.sql > dump/counts.txt
      - name: Restore into a throwaway stack and compare
        run: |
          mkdir -p "$RUNNER_TEMP/restore" && cd "$RUNNER_TEMP/restore"
          supabase init --force >/dev/null
          supabase start -x studio,edge-runtime,logflare,vector,imgproxy,realtime,storage-api,supavisor,mailpit
          # As the local superuser: roles.sql carries Supabase's own GRANT SET ON PARAMETER lines,
          # which postgres may not run (checked with a local rehearsal, 2026-10-15).
          LOCAL=$(supabase status -o json | jq -r .DB_URL | sed 's#//postgres:#//supabase_admin:#')
          D="$GITHUB_WORKSPACE/dump"
          psql "$LOCAL" --single-transaction -v ON_ERROR_STOP=1 \
            -f "$D/roles.sql" -f "$D/schema.sql" \
            -c 'SET session_replication_role = replica' -f "$D/data.sql"
          psql "$LOCAL" --single-transaction -v ON_ERROR_STOP=1 \
            -f "$D/history_schema.sql" -f "$D/history_data.sql" -f "$D/auth-triggers.sql"
          psql "$LOCAL" -At -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/scripts/backup-counts.sql" > "$D/restored.txt"
          cd "$GITHUB_WORKSPACE" && bun scripts/compare-counts.ts dump/counts.txt dump/restored.txt
      - name: Encrypt
        run: |
          tar -czf - -C dump roles.sql schema.sql data.sql history_schema.sql history_data.sql auth-triggers.sql counts.txt \
            | age -R .github/backup-recipient.txt > backup.tar.gz.age
          rm -rf dump
      - uses: actions/upload-artifact@v7
        with:
          name: tapnshow-backup-${{ github.run_id }}
          path: backup.tar.gz.age
          retention-days: 30
          if-no-files-found: error
      - name: Post failures to #uptime
        if: failure()
        env:
          DISCORD_UPTIME_WEBHOOK: ${{ secrets.DISCORD_UPTIME_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun scripts/discord-notify.ts --webhook-env DISCORD_UPTIME_WEBHOOK --tone failure \
            --title "Nightly backup failed" --url "$RUN_URL" \
            --description "No backup was saved tonight. The last good one is in the run list." --source "backup"
